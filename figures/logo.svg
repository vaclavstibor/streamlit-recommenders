<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="streamlit-recommenders logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- ranked recommendation cards -->
  <g fill="#ffffff">
    <rect x="27" y="32" width="22" height="50" rx="5" opacity="0.5"/>
    <rect x="53" y="24" width="22" height="58" rx="5" opacity="0.85"/>
    <rect x="79" y="36" width="22" height="46" rx="5" opacity="0.5"/>
  </g>
  <!-- magnifying glass: inspect, don't just measure -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round">
    <circle cx="84" cy="84" r="19" fill="url(#bg)" stroke-width="7"/>
    <line x1="98" y1="98" x2="110" y2="110" stroke-width="8"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet">
  <title>StreamlitRecommenders overview: architecture, API usage, and resulting UI</title>
  <desc>Two-row figure for the StreamlitRecommenders paper. Top row: high-level architecture. Bottom row: application code and running demo, connected by sr.run(...).</desc>

  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.08"/>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 10 4, 0 8" fill="#374151"/>
    </marker>
  </defs>

  <!-- ROW 1: High-level architecture -->
  <text x="800" y="38" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#111827">High-level Architecture</text>

  <!-- Cluster 1: Data Preparation -->
  <g transform="translate(40, 60)">
    <rect x="0" y="0" width="300" height="220" rx="12" ry="12" fill="#fafafa" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="150" y="30" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#111827">Data Preparation</text>
    <rect x="24" y="50" width="252" height="38" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="150" y="75" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e3a8a">MovieLens</text>
    <rect x="24" y="96" width="252" height="38" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="150" y="121" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e3a8a">GoodBooks-10k</text>
    <rect x="24" y="142" width="252" height="38" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="150" y="167" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e3a8a">Custom Dataset</text>
    <rect x="72" y="182" width="156" height="24" rx="5" fill="#f3f4f6" stroke="#e5e7eb" stroke-width="1"/>
    <text x="150" y="199" text-anchor="middle" font-family="Menlo, Courier, monospace" font-size="13" fill="#6b7280">sr.data.prepare</text>
  </g>

  <line x1="350" y1="170" x2="400" y2="170" stroke="#374151" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Cluster 2: Recommender -->
  <g transform="translate(410, 60)">
    <rect x="0" y="0" width="320" height="220" rx="12" ry="12" fill="#fafafa" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="160" y="30" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#111827">Recommender</text>
    <rect x="24" y="50" width="272" height="36" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <text x="160" y="73" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#14532d">RecommenderProtocol</text>
    <rect x="24" y="92" width="272" height="36" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <text x="160" y="115" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#14532d">Function, Subclass, or Artifact</text>
    <rect x="24" y="134" width="272" height="36" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="160" y="157" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#14532d">ItemKNN, EASE, Sequential CF</text>
    <rect x="52" y="182" width="216" height="24" rx="5" fill="#f3f4f6" stroke="#e5e7eb" stroke-width="1"/>
    <text x="160" y="199" text-anchor="middle" font-family="Menlo, Courier, monospace" font-size="13" fill="#6b7280">get_recommendations(...)</text>
  </g>

  <line x1="740" y1="170" x2="790" y2="170" stroke="#374151" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Cluster 3: Runtime -->
  <g transform="translate(800, 60)">
    <rect x="0" y="0" width="280" height="220" rx="12" ry="12" fill="#fafafa" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="140" y="30" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#111827">Runtime</text>
    <rect x="24" y="50" width="232" height="38" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
    <text x="140" y="75" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#78350f">Widget-driven Reruns</text>
    <rect x="24" y="96" width="232" height="38" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
    <text x="140" y="121" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#78350f">Cached Predictions</text>
    <rect x="24" y="142" width="232" height="38" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
    <text x="140" y="167" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#78350f">Multi-model Compare</text>
    <rect x="44" y="182" width="192" height="24" rx="5" fill="#f3f4f6" stroke="#e5e7eb" stroke-width="1"/>
    <text x="140" y="199" text-anchor="middle" font-family="Menlo, Courier, monospace" font-size="13" fill="#6b7280">sr.runtime.state</text>
  </g>

  <line x1="1090" y1="170" x2="1140" y2="170" stroke="#374151" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Cluster 4: Streamlit Page -->
  <g transform="translate(1150, 60)">
    <rect x="0" y="0" width="410" height="220" rx="12" ry="12" fill="#fafafa" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="205" y="30" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#111827">Streamlit Page</text>
    <rect x="24" y="50" width="362" height="38" rx="8" fill="#fdf2f8" stroke="#f9a8d4" stroke-width="1.5"/>
    <text x="205" y="75" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#831843">User Profile and Configuration</text>
    <rect x="24" y="96" width="362" height="38" rx="8" fill="#fdf2f8" stroke="#f9a8d4" stroke-width="1.5"/>
    <text x="205" y="121" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#831843">Recommendations Layout</text>
    <rect x="24" y="142" width="362" height="38" rx="8" fill="#fdf2f8" stroke="#f9a8d4" stroke-width="1.5"/>
    <text x="205" y="167" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#831843">Markdown + Plots + Visual Inspection</text>
    <rect x="117" y="182" width="176" height="24" rx="5" fill="#f3f4f6" stroke="#e5e7eb" stroke-width="1"/>
    <text x="205" y="199" text-anchor="middle" font-family="Menlo, Courier, monospace" font-size="13" fill="#6b7280">sr.run(...)</text>
  </g>

  <!-- Feedback loop -->
  <path d="M 1490 288 Q 1215 348 958 288" fill="none" stroke="#374151" stroke-width="2"/>
  <polygon points="958,288 970,284 970,292" fill="#374151"/>
  <text x="1215" y="338" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6b7280">Feedback Loop</text>

  <line x1="40" y1="400" x2="1560" y2="400" stroke="#e5e7eb" stroke-width="1"/>

  <!-- ROW 2 section titles -->
  <text x="400" y="436" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#111827">Application Code</text>
  <text x="1200" y="436" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#111827">Running Demo Application</text>

  <!-- ROW 2 LEFT: Code -->
  <g transform="translate(40, 450)">
    <rect x="0" y="0" width="720" height="444" rx="12" ry="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="20" y="24" font-family="Menlo, Courier, monospace" font-size="16" fill="#1f2937"><tspan fill="#0550ae">import</tspan> streamlit_recommenders <tspan fill="#0550ae">as</tspan> sr</text>
    <text x="20" y="44" font-family="Menlo, Courier, monospace" font-size="16" fill="#1f2937"> </text>
    <text x="20" y="64" font-family="Menlo, Courier, monospace" font-size="16" fill="#1f2937">DATA_DIR = <tspan fill="#0a3069">"data/ml-latest-small"</tspan></text>
    <text x="20" y="84" font-family="Menlo, Courier, monospace" font-size="16" fill="#1f2937">ITEMS, TRAIN, TEST = sr.load_dataset(DATA_DIR)</text>
    <text x="20" y="104" font-family="Menlo, Courier, monospace" font-size="16" fill="#1f2937">models = sr.load_artifacts({</text>
    <text x="20" y="124" font-family="Menlo, Courier, monospace" font-size="16" fill="#1f2937">    <tspan fill="#0a3069">"ItemKNN"</tspan>: f<tspan fill="#0a3069">"{DATA_DIR}/artifacts/itemknn.npz"</tspan>,</text>
    <text x="20" y="144" font-family="Menlo, Courier, monospace" font-size="16" fill="#1f2937">    <tspan fill="#0a3069">"EASE"</tspan>: f<tspan fill="#0a3069">"{DATA_DIR}/artifacts/ease.npz"</tspan>,</text>
    <text x="20" y="164" font-family="Menlo, Courier, monospace" font-size="16" fill="#1f2937">    <tspan fill="#0a3069">"Sequential CF"</tspan>: f<tspan fill="#0a3069">"{DATA_DIR}/artifacts/sequential_cf.npz"</tspan>,</text>
    <text x="20" y="184" font-family="Menlo, Courier, monospace" font-size="16" fill="#1f2937">}, TRAIN)</text>
    <text x="20" y="204" font-family="Menlo, Courier, monospace" font-size="16" fill="#1f2937"> </text>
    <text x="20" y="224" font-family="Menlo, Courier, monospace" font-size="16" fill="#1f2937">sr.run(</text>
    <text x="20" y="244" font-family="Menlo, Courier, monospace" font-size="16" fill="#1f2937">    get_recommendations=models,</text>
    <text x="20" y="264" font-family="Menlo, Courier, monospace" font-size="16" fill="#1f2937">    items=ITEMS, interactions=TRAIN,</text>
    <text x="20" y="284" font-family="Menlo, Courier, monospace" font-size="16" fill="#1f2937">    params=PARAMS,</text>
    <text x="20" y="304" font-family="Menlo, Courier, monospace" font-size="16" fill="#1f2937">    title=<tspan fill="#0a3069">"3 Models Comparison: Rows Layout"</tspan>,</text>
    <text x="20" y="324" font-family="Menlo, Courier, monospace" font-size="16" fill="#1f2937">    intro=intro, body=appendix,</text>
    <text x="20" y="344" font-family="Menlo, Courier, monospace" font-size="16" fill="#1f2937">)</text>
  </g>

  <text x="800" y="678" text-anchor="middle" font-family="Menlo, Courier, monospace" font-size="14" fill="#6b7280">sr.run(...)</text>
  <line x1="770" y1="690" x2="830" y2="690" stroke="#374151" stroke-width="2.5" marker-end="url(#arrowhead)"/>

  <!-- ROW 2 RIGHT: UI mockup -->
  <g transform="translate(840, 450)">
    <rect x="0" y="0" width="720" height="444" rx="12" ry="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="720" height="32" fill="#fafafa"/>
    <text x="360" y="21" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#111827">3 Models Comparison: Rows Layout</text>
    <rect x="0" y="32" width="170" height="344" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
    <text x="85" y="56" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#6b7280">Sidebar</text>
    <text x="14" y="82" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#374151">User</text>
    <rect x="14" y="88" width="142" height="24" rx="4" fill="#fff" stroke="#d1d5db" stroke-width="1"/>
    <text x="22" y="105" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1f2937">user 42</text>
    <text x="14" y="132" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#374151">Number of Recommendations</text>
    <rect x="14" y="138" width="142" height="24" rx="4" fill="#fff" stroke="#d1d5db" stroke-width="1"/>
    <text x="22" y="155" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1f2937">20</text>
    <rect x="14" y="178" width="142" height="28" rx="6" fill="#2563eb"/>
    <text x="85" y="197" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#ffffff">Get Recommendations</text>
    <g transform="translate(180, 40)">
      <text x="0" y="14" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#374151">Past Interactions</text>
      <rect x="0" y="22" width="36" height="48" rx="3" fill="#e5e7eb" stroke="#d1d5db" stroke-width="1"/>
      <rect x="42" y="22" width="36" height="48" rx="3" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
      <rect x="84" y="22" width="36" height="48" rx="3" fill="#fce7f3" stroke="#f9a8d4" stroke-width="1"/>
      <rect x="126" y="22" width="36" height="48" rx="3" fill="#d1fae5" stroke="#6ee7b7" stroke-width="1"/>
      <rect x="168" y="22" width="36" height="48" rx="3" fill="#fef3c7" stroke="#fcd34d" stroke-width="1"/>
      <text x="0" y="92" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#374151">Selected This Session</text>
      <rect x="0" y="100" width="36" height="48" rx="3" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
      <rect x="42" y="100" width="36" height="48" rx="3" fill="#cffafe" stroke="#0891b2" stroke-width="2"/>
      <text x="0" y="172" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#6b7280">ItemKNN</text>
      <rect x="52" y="156" width="30" height="40" rx="2" fill="#e5e7eb" stroke="#d1d5db" stroke-width="1"/>
      <rect x="86" y="156" width="30" height="40" rx="2" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
      <rect x="120" y="156" width="30" height="40" rx="2" fill="#fce7f3" stroke="#f9a8d4" stroke-width="1"/>
      <rect x="154" y="156" width="30" height="40" rx="2" fill="#d1fae5" stroke="#6ee7b7" stroke-width="1"/>
      <rect x="188" y="156" width="30" height="40" rx="2" fill="#fef3c7" stroke="#fcd34d" stroke-width="1"/>
      <text x="0" y="222" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#6b7280">EASE</text>
      <rect x="52" y="206" width="30" height="40" rx="2" fill="#fce7f3" stroke="#f9a8d4" stroke-width="1"/>
      <rect x="86" y="206" width="30" height="40" rx="2" fill="#e5e7eb" stroke="#d1d5db" stroke-width="1"/>
      <rect x="120" y="206" width="30" height="40" rx="2" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
      <rect x="154" y="206" width="30" height="40" rx="2" fill="#fef3c7" stroke="#fcd34d" stroke-width="1"/>
      <rect x="188" y="206" width="30" height="40" rx="2" fill="#d1fae5" stroke="#6ee7b7" stroke-width="1"/>
      <text x="0" y="272" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#6b7280">Sequential CF</text>
      <rect x="52" y="256" width="30" height="40" rx="2" fill="#d1fae5" stroke="#6ee7b7" stroke-width="1"/>
      <rect x="86" y="256" width="30" height="40" rx="2" fill="#fef3c7" stroke="#fcd34d" stroke-width="1"/>
      <rect x="120" y="256" width="30" height="40" rx="2" fill="#e5e7eb" stroke="#d1d5db" stroke-width="1"/>
      <rect x="154" y="256" width="30" height="40" rx="2" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
      <rect x="188" y="256" width="30" height="40" rx="2" fill="#fce7f3" stroke="#f9a8d4" stroke-width="1"/>
    </g>
    <rect x="0" y="376" width="720" height="68" fill="#fafafa" stroke="#e5e7eb" stroke-width="1"/>
    <text x="14" y="398" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#6b7280">Overlap Heatmap</text>
    <g transform="translate(14, 408)">
      <rect x="0" y="0" width="14" height="14" fill="#dbeafe"/>
      <rect x="14" y="0" width="14" height="14" fill="#93c5fd"/>
      <rect x="28" y="0" width="14" height="14" fill="#dbeafe"/>
      <rect x="0" y="14" width="14" height="14" fill="#93c5fd"/>
      <rect x="14" y="14" width="14" height="14" fill="#1d4ed8"/>
      <rect x="28" y="14" width="14" height="14" fill="#93c5fd"/>
      <rect x="0" y="28" width="14" height="14" fill="#dbeafe"/>
      <rect x="14" y="28" width="14" height="14" fill="#93c5fd"/>
      <rect x="28" y="28" width="14" height="14" fill="#dbeafe"/>
    </g>
  </g>
</svg>

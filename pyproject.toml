[project]
name = "streamlit-recommenders"
version = "0.1.0"
description = "Lightweight Streamlit library for interactive recommender system demos"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["streamlit", "recommender-systems", "recsys", "demo"]
dependencies = [
    "streamlit>=1.28",
    "pandas>=2.0",
    "plotly>=5.0",
    "pyyaml>=6.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]

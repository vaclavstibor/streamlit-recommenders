[project]
name = "streamlit-recommenders"
version = "0.1.0"
description = "Lightweight Streamlit library for interactive recommender system demos"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Václav Stibor" },
    { name = "Vojtěch Vančura" },
    { name = "Ladislav Peška" },
]
keywords = ["streamlit", "recommender-systems", "recsys", "demo"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "streamlit>=1.28",
    "pandas>=2.0",
    "plotly>=5.0",
    "pyyaml>=6.0",
    "numpy>=1.24",
    "python-dotenv>=1.0",
    "scipy",
    "kagglehub",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "build", "twine"]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.24"]

[project.urls]
Homepage = "https://github.com/vaclavstibor/streamlit-recommenders"
Repository = "https://github.com/vaclavstibor/streamlit-recommenders"
Issues = "https://github.com/vaclavstibor/streamlit-recommenders/issues"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["streamlit_recommenders*"]
exclude = ["tests*", "examples*", "scripts*"]

[tool.setuptools.package-data]
streamlit_recommenders = ["assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
